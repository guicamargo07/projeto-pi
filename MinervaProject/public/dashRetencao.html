  <div class="conteudo">

    <main class="principal">

      <div class="cabecalho">
        <div>
          <h1 class="titulo">RETENÇÃO</h1>
          <p class="subtitulo">Onde existem sinais de dificuldade de conclusão?</p>
        </div>

        <button class="filtro" type="button" aria-label="Filtrar">
          <svg class="icone" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.5 10 19 14 21 14 12.5 22 3"/></svg>
        </button>
      </div>

      <section class="cards cards--2">
        <div class="card">
          <span class="card__rotulo">TAXA DE CRESCIMENTO DE CONCLUINTES</span>
          <strong class="card__valor card__valor--verde">▲ 8%</strong>
        </div>

        <div class="card card--barras">
          <span class="card__rotulo">CONCLUSÃO POR SEGMENTO</span>

          <div class="barras">
            <div class="barra">
              <span class="barra__nome">Presencial</span>
              <div class="barra__trilho">
                <div class="barra__preenchimento" style="--valor: 48%">48%</div>
              </div>
            </div>

            <div class="barra">
              <span class="barra__nome">EAD</span>
              <div class="barra__trilho">
                <div class="barra__preenchimento" style="--valor: 38%">38%</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <h2 class="grafico__titulo">Conclusão por Área</h2>
      <section class="grafico grafico--alto">
        <canvas id="graficoAreas"></canvas>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const areas = [
      "Educação", "Saúde", "Tecnologia", "Engenharia",
      "Agricultura", "Artes", "Negócios", "Serviços"
    ];

    // valores de exemplo: trocar pelos dados reais
    const ingressantes = [2200, 3200, 4000, 2800, 1200, 1500, 3000, 1800];
    const concluintes  = [1300, 1700, 2500, 1500,  700,  900, 1600, 1000];

    const corIngressantes = "#59534E";   
    const corConcluintes  = "#D4A94C";   
    const tamanhoFonte = window.innerWidth <= 700 ? 10 : 13;

    const canvas = document.getElementById("graficoAreas");

    new Chart(canvas, {
      type: "bar",
      data: {
        labels: areas,
        datasets: [
          {
            label: "Qtd. Ingressantes",
            data: ingressantes,
            backgroundColor: corIngressantes,
            borderRadius: 6,
            borderSkipped: false
          },
          {
            label: "Qtd. Concluintes",
            data: concluintes,
            backgroundColor: corConcluintes,
            borderRadius: 6,
            borderSkipped: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: "top",
            labels: {
              usePointStyle: true,
              pointStyle: "circle",
              boxWidth: 8,
              font: { size: tamanhoFonte, family: "Montserrat" },
              color: "#59534E"
            }
          }
        },
        scales: {
          y: {
            min: 0,
            max: 4000,
            ticks: {
              stepSize: 1000,
              font: { size: tamanhoFonte, family: "Montserrat" },
              color: "#59534E",
              callback: (valor) => valor.toLocaleString("pt-BR")  // 4.000
            },
            grid: { color: "#E4DFD7" },
            border: { display: false }
          },
          x: {
            ticks: {
              font: { size: tamanhoFonte, family: "Montserrat" },
              color: "#59534E"
            },
            grid: { display: false }
          }
        }
      }
    });
  </script>
  <script>
    (() => {
      const usuarioDashboard = JSON.parse(sessionStorage.getItem("usuario"));
      const fotoPerfilDashboard = document.getElementById("fotoPerfilDashboard");

      if (usuarioDashboard?.foto) {
        fotoPerfilDashboard.src = `/imgs/${usuarioDashboard.foto}.png`;
      }

      document.getElementById("logoutDashboard").addEventListener("click", (evento) => {
        evento.preventDefault();
        logout();
      });
    })();
  </script>
    <script src="js/backIni/sessionStorage.js"></script>
