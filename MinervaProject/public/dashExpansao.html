  <div class="conteudo">

    </header>

    <main class="principal">

      <div class="cabecalho">
        <div>
          <h1 class="titulo">EXPANSÃO</h1>
          <p class="subtitulo">Onde o crescimento é favorável?</p>
        </div>

        <button class="filtro" type="button" aria-label="Filtrar">
          <svg class="icone" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.5 10 19 14 21 14 12.5 22 3"/></svg>
        </button>
      </div>

      <section class="cards">
        <div class="card">
          <span class="card__rotulo">TAXA DE INTERESSE</span>
          <strong class="card__valor card__valor--azul">4,2</strong>
        </div>

        <div class="card">
          <span class="card__rotulo">INSTITUIÇÕES COM OFERTA</span>
          <strong class="card__valor">20</strong>
        </div>

        <div class="card">
          <span class="card__rotulo">TOTAL DE VAGAS</span>
          <strong class="card__valor card__valor--azul">4.869</strong>
        </div>
      </section>

      <h2 class="grafico__titulo">Mercados em crescimento</h2>

      <div class="tabela-wrapper">
        <table class="tabela">
          <thead>
            <tr>
              <th>Município</th>
              <th>Cres. Presencial</th>
              <th>Cres. EAD</th>
              <th>Interesse</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const mercados = [
      { municipio: "Campinas",       presencial: 15, ead: 5, interesse: 4.2 },
      { municipio: "Ribeirão Preto", presencial: 12, ead: 7, interesse: 3.8 },
      { municipio: "Sorocaba",       presencial: 9,  ead: 6, interesse: 3.5 },
      { municipio: "Santos",         presencial: 8,  ead: 7, interesse: 3.1 }
    ];

    const formatarNota = (n) => n.toFixed(1).replace(".", ",");
    const formatarCres = (n) => (n >= 0 ? "+" : "") + n + "%";

    document.getElementById("corpoTabela").innerHTML = mercados.map((m) => `
      <tr>
        <td>${m.municipio}</td>
        <td class="tabela__positivo">${formatarCres(m.presencial)}</td>
        <td class="tabela__positivo">${formatarCres(m.ead)}</td>
        <td class="tabela__interesse">${formatarNota(m.interesse)}</td>
      </tr>
    `).join("");
  </script>
  <script>
    (() => {
      const usuarioDashboard = JSON.parse(sessionStorage.getItem("usuario"));
      const fotoPerfilDashboard = document.getElementById("fotoPerfilDashboard");

      if (usuarioDashboard?.foto) {
        fotoPerfilDashboard.src = `/imgs/${usuarioDashboard.foto}.png`;
      }

      document.getElementById("logoutDashboard").addEventListener("click", (evento) => {
        evento.preventDefault();
        logout();
      });
    })();
  </script>
    <script src="js/backIni/sessionStorage.js"></script>
