<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Visão Geral</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashGeral.css">
</head>
<body>

  <!-- ========== MENU LATERAL ========== -->
  <aside class="sidebar">
    <img class="sidebar__logo" src="imgs/logo_dash.png" alt="Logo M&C">

    <nav class="menu">
      <a href="#" class="menu__item menu__item--principal menu__item--ativo">
        <svg class="icone" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </a>

      <!-- Submenu do Dashboard -->
      <a href="#" class="menu__item menu__item--sub menu__item--ativo">Geral</a>
      <a href="#" class="menu__item menu__item--sub">Retenção</a>
      <a href="#" class="menu__item menu__item--sub">Expansão</a>

      <a href="#" class="menu__item menu__item--principal">
        <svg class="icone" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
        Suporte
      </a>
      <a href="#" class="menu__item menu__item--principal">
        <svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Ajustes
      </a>
    </nav>
  </aside>

  <!-- ========== ÁREA PRINCIPAL ========== -->
  <div class="conteudo">

    <header class="topo">
      <a href="#" class="topo__perfil">
        <svg class="icone icone--grande" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.5"/><path d="M5.5 19c1.5-3 4-4 6.5-4s5 1 6.5 4"/></svg>
        Meu perfil
      </a>
    </header>

    <main class="principal">
      <h1 class="titulo">VISÃO GERAL</h1>
      <p class="subtitulo">Como está o mercado agora?</p>

      <section class="cards">
        <div class="card">
          <span class="card__rotulo">TAXA DE OCUPAÇÃO</span>
          <!-- id adicionado: o JS troca a cor conforme o valor -->
          <strong id="kpiOcupacao" class="card__valor">75%</strong>
        </div>

        <div class="card">
          <span class="card__rotulo">TAXA DE CRESCIMENTO</span>
          <strong class="card__valor card__valor--verde">▲ 4,2%</strong>
        </div>

        <div class="card">
          <span class="card__rotulo">PÚBLICO PREDOMINANTE</span>
          <strong class="card__valor card__valor--azul card__valor--menor">18 - 24 Anos</strong>
          <span class="card__detalhe">(65%)</span>
        </div>
      </section>

      <h2 class="grafico__titulo">Evolução de matrículas</h2>
      <section class="grafico">
        <canvas id="graficoMatriculas"></canvas>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    /* ========== KPI DE OCUPAÇÃO (cor dinâmica) ========== */
    const taxaDeOcupacao = 75; // trocar pelo valor real

    const kpiOcupacao = document.getElementById("kpiOcupacao");
    kpiOcupacao.textContent = taxaDeOcupacao + "%";

    if (taxaDeOcupacao <= 44.9) {
      kpiOcupacao.classList.add("card__valor--vermelho");
    } else if (taxaDeOcupacao <= 50) {
      kpiOcupacao.classList.add("card__valor--amarelo");
    } else {
      kpiOcupacao.classList.add("card__valor--verde");
    }

    /* ========== GRÁFICO ========== */
    const anos = [2019, 2020, 2021, 2022, 2023, 2024];
    const matriculas = [80000, 40000, 25000, 43000, 52000, 56000];

    const azul = "#0097b2";
    const canvas = document.getElementById("graficoMatriculas");

    // fonte menor em telas pequenas
    const tamanhoFonte = window.innerWidth <= 700 ? 11 : 14;

    new Chart(canvas, {
      type: "line",
      data: {
        labels: anos,
        datasets: [
          {
            data: matriculas,
            borderColor: azul,
            backgroundColor: azul,
            borderWidth: 4,
            pointRadius: 5,
            tension: 0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 8, right: 10 } },
        plugins: { legend: { display: false } },
        scales: {
          y: {
            min: 0,
            max: 80000,
            ticks: {
              stepSize: 20000,
              font: { size: tamanhoFonte, family: "Montserrat" },
              color: "#000",
              callback: (valor) => (valor === 0 ? "0" : valor / 1000 + "mil")
            },
            grid: { color: "#d9d9d9" },
            border: { display: false }
          },
          x: {
            ticks: {
              font: { size: tamanhoFonte, family: "Montserrat" },
              color: "#000"
            },
            grid: { display: false }
          }
        }
      }
    });
  </script>
</body>
</html>
