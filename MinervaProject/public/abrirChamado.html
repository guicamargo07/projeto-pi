<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/dash.css">
    <link rel="stylesheet" href="css/suporte.css">
</head>

<body>

    <aside class="sidebar">
        <a href="index.html" class="sidebar__link-logo" aria-label="Ir para a página inicial">
            <img class="sidebar__logo" src="imgs/logo_dash.png" alt="Logo M&C">
        </a>

        <nav class="menu">
            <a href="dashGeral.html" class="menu__item menu__item--principal">
                <svg class="icone" viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                Dashboard
            </a>

            <a href="dashGeral.html" class="menu__item menu__item--sub">Geral</a>
            <a href="dashRetencao.html" class="menu__item menu__item--sub">Retenção</a>
            <a href="dashExpansao.html" class="menu__item menu__item--sub">Expansão</a>

            <a href="suporte.html" class="menu__item menu__item--principal menu__item--ativo">
                <svg class="icone" viewBox="0 0 24 24">
                    <path
                        d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z" />
                </svg>
                Suporte
            </a>
            <a href="#" class="menu__item menu__item--principal">
                <svg class="icone" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                Ajustes
            </a>
        </nav>
    </aside>

    <div class="conteudo">

        <header class="topo">
            <a href="#" class="topo__perfil">
                <svg class="icone icone--grande" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <circle cx="12" cy="10" r="3.5" />
                    <path d="M5.5 19c1.5-3 4-4 6.5-4s5 1 6.5 4" />
                </svg>
                Meu perfil
            </a>
        </header>

        <main class="principal principal--form">

            <h1 class="titulo titulo--centro">ABRIR CHAMADO</h1>

            <form class="form" id="formChamado">
                <div class="form__grupo">
                    <label class="form__rotulo" for="assunto">Assunto</label>
                    <input class="form__campo" id="assunto" name="assunto" type="text" required>
                </div>

                <div class="form__grupo">
                    <label class="form__rotulo" for="categoria">Categoria</label>
                    <select class="form__campo form__campo--select" id="categoria" name="categoria" required>
                        <option value="" disabled selected>Selecione uma categoria</option>
                        <option value="indicadores">Indicadores</option>
                        <option value="arquivos">Importação de arquivos</option>
                        <option value="conta">Conta e dados</option>
                        <option value="notificacoes">Notificações</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <div class="form__grupo">
                    <label class="form__rotulo" for="descricao">Descrição</label>
                    <textarea class="form__campo form__campo--texto" id="descricao" name="descricao" rows="5"
                        required></textarea>
                </div>

                <div class="acoes">
                    <a href="suporte.html" class="botao">Cancelar</a>
                    <button type="submit" class="botao botao--primario">Enviar chamado</button>
                </div>
            </form>

        </main>
    </div>
    <script>
        document.getElementById("formChamado").addEventListener("submit", (e) => {
            e.preventDefault();
            // aqui entra o envio real dos dados ao servidor, quando existir
            alert("Chamado enviado com sucesso! O time de suporte entrará em contato");
            window.location.href = "suporte.html";
        });
    </script>
</body>

</html>
